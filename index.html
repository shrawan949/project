<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🛒 ShopEasy</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Best Deals on Electronics, Fashion & Accessories</p>
    <button>Shop Now</button>
</section>

<section class="products">

<h2>Featured Products</h2>

<div class="product-container">

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Laptop">
<h3>Laptop</h3>

<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Headphones">
<h3>Headphones</h3>
<p>₹2,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Smart Watch">
<h3>Smart Watch</h3>
<p>₹4,499</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Mobile">
<h3>Smart Phone</h3>
<p>₹29,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Shoes">
<h3>Running Shoes</h3>
<p>₹3,499</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200" alt="Bag">
<h3>Backpack</h3>
<p>₹1,499</p>
<button>Add to Cart</button>
</div>

</div>

</section>

<footer>
<p>© 2026 ShopEasy | All Rights Reserved</p>
</footer>

</html>
