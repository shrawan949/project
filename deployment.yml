apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
  namespace: practice
spec:
  replicas: 10
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: app
          image: nginx
          ports:
            - containerPort: 80
