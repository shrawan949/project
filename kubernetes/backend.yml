
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend
  namespace: notes-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: notes-backend
  template:
    metadata:
      labels:
        app: notes-backend
    spec:
      containers:
        - name: backend
          image: shrawanambarte0101/notes-backend:1
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://notesadmin:redhat@mongodb-service:27017/notesapp?authSource=admin"
