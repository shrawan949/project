services:
  mongo:
    image: mongo:8
    container_name: notes-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - notes-network

  backend:
    build:
      context: ./application/backend
    container_name: notes-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://mongo:27017"
      Cors: "http://13.205.67.13:8080"

      ACCESS_TOKEN_SECRET: d25e977892fe9bc7a6c0f1c74542d45589fd7a8f46580d631ec481205dbf3c60
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_SECRET: d200425debc903754e1b5d2f0e10e6a93266a3e89327c79679c077cce4df1cb2
      REFRESH_TOKEN_EXPIRY: 10d
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - notes-network

  frontend:
    build:
      context: ./application/frontend
      args:
        VITE_API_URL: "http://13.205.67.13:5000/api"
        VITE_SOCKET_URL: "http://13.205.67.13:5000"
    container_name: notes-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - notes-network

volumes:
  mongo_data:

networks:
  notes-network:
    driver: bridge

      
